version: 2.1
jobs:
  android-verify:
    docker:
      - image: cimg/android:2025.04
    resource_class: medium
    working_directory: ~/V2V
    steps:
      - checkout
      - restore_cache:
          keys:
            - debug-keystore-v1
      - restore_cache:
          keys:
            - gradle-v1-{{ checksum "app/gradle.lockfile" }}-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}
      - run:
          name: Build, unit tests and Android lint
          command: |
            set -o pipefail
            ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug 2>&1 | tee ci-build.log
      - store_artifacts:
          path: ci-build.log
      - run:
          name: Package APK and checksum
          command: |
            ./scripts/package-apk.sh
            python3 ./scripts/verification-summary.py
      - store_test_results:
          path: app/build/test-results/testDebugUnitTest
      - store_artifacts:
          path: deliverables
      - store_artifacts:
          path: app/build/reports
      - save_cache:
          key: debug-keystore-v1
          paths:
            - ~/.android/debug.keystore
      - save_cache:
          key: gradle-v1-{{ checksum "app/gradle.lockfile" }}-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper
workflows:
  verify:
    jobs:
      - android-verify
